<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>typefaces-italic</title>
  <style>
    :root {
      --page-width: 900px;
      --page-bg: #f6f1e8;
      --paper-bg: #fffdf8;
      --ink: #1f1b16;
      --rule: #d9cfbf;
      --accent: #8b6f47;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        linear-gradient(180deg, #ede4d6 0%, #f6f1e8 25%, #efe6d8 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      padding: 32px 16px;
    }
    .page {
      width: min(100%, var(--page-width));
      margin: 0 auto;
      background: var(--paper-bg);
      border: 1px solid var(--rule);
      box-shadow: 0 20px 45px rgba(52, 39, 21, 0.12);
      padding: 48px 56px;
    }
    .document-header,
    .document-footer {
      border-bottom: 1px solid var(--rule);
      margin-bottom: 24px;
      padding-bottom: 12px;
    }
    .document-footer {
      border-top: 1px solid var(--rule);
      border-bottom: none;
      margin-top: 24px;
      margin-bottom: 0;
      padding-top: 12px;
      padding-bottom: 0;
    }
    .document-header h2,
    .document-footer h2 {
      margin: 0 0 10px 0;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-family: Arial, Helvetica, sans-serif;
    }
    .quill-body {
      font-family: "Courier New", Courier, monospace;
      font-size: 0.95rem;
      white-space: normal;
    }
    .quill-paragraph {
      margin-right: 0;
    }
    .tab {
      display: inline-block;
      width: 4ch;
    }
    .bold { font-weight: 700; }
    .italic { font-style: italic; }
    .underline { text-decoration: underline; }
    .sub { vertical-align: sub; font-size: 0.8em; }
    .super { vertical-align: super; font-size: 0.8em; }
    @media (max-width: 720px) {
      body { padding: 12px; }
      .page { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    
    <section class="quill-body">
      <p class="quill-paragraph" style="margin-left:70.00%;width:65.00%;text-align:left;text-indent:106.00ch;line-height:110%;margin-top:0;margin-bottom:0.20em;"></p>
<p class="quill-paragraph" style="margin-left:70.00%;width:65.00%;text-align:left;text-indent:106.00ch;line-height:110%;margin-top:0;margin-bottom:0.20em;">page nnn</p>
<p class="quill-paragraph" style="margin-left:11.25%;width:77.50%;text-align:right;text-indent:5.00ch;line-height:110%;margin-top:0;margin-bottom:0.20em;">Normal<span class="tab"></span><span class="super">High normal</span><span class="tab"></span><span class="sub">low normal</span></p>
<p class="quill-paragraph" style="margin-left:11.25%;width:77.50%;text-align:right;text-indent:5.00ch;line-height:110%;margin-top:0;margin-bottom:0.20em;"><span class="italic">Bold</span> <span class="tab"></span><span class="bold super">high bold</span><span class="tab"></span><span class="tab"></span><span class="bold sub">low bold</span></p>
<p class="quill-paragraph" style="margin-left:11.25%;width:77.50%;text-align:right;text-indent:5.00ch;line-height:110%;margin-top:0;margin-bottom:0.20em;"><span class="underline">Normal</span><span class="tab"></span><span class="underline super">high normal</span><span class="tab"></span><span class="underline sub">low normal</span></p>
    </section>
    <section class="document-footer"><h2>Footer</h2><p class="quill-paragraph" style="margin-left:0.00%;width:100.00%;text-align:left;text-indent:0.00ch;line-height:110%;margin-top:0;margin-bottom:0.20em;"></p></section>
  </main>
</body>
</html>
